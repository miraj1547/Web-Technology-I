<!doctype html>
<html>
  <head>
    <title>Simple FORM in HTML</title>
  </head>
  <body>
    <h3>LGIC</h3>
    <form>
      <label for="first name">First Name:</label>
      <input type="text" placeholder="Enter your first name" /> <br />
      <label for="last name">Last Name:</label>
      <input type="text" placeholder="Enter your last name" /> <br />
      <label for="email">Email:</label>
      <input type="email" placeholder="Enter your email" /> <br />
      <label for="password">password:</label>
      <input type="password"/> <br/>
      <label for="gender">gender:</label>
      male<input type="radio" value="male" name="gender"/> 
      female<input type="radio" value="female" name="gender"/> 
      other <input type="radio" value="other" name="gender"/><br/>
      Nationality:
      <select>
        <option> Nepali</option>
        <option>Indian</option>
        <option selected> Chinese</option>
      </select>
      <br/>
      Date: <input type="datetime-local"/><br/><br/>
      Hobbies: <br/>
      Playing<input type="checkbox" value="Playing"/><br/>
      Swimming<input type="checkbox" value="Playing"/><br/>
      Dancing<input type="checkbox" value="Playing"/> <br/> <br/>
      Write about yourself:
      <!--<textarea>-->
        <textarea style="height:100px; width: 200px">
          this is the content area
        </textarea>
        <br/>
        <button>Log In </button>
        <input type="submit" value="Submit"/>
        <input type="reset" value="Reset"/>
    </form>
  </body>
</html>
